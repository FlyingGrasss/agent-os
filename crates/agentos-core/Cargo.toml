[package]
name = "agentos-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentos-types = { workspace = true }
agentos-dsl = { workspace = true }
agentos-policy = { workspace = true }
agentos-tools = { path = "../agentos-tools" }
# For the leak counters. `Disclosure` is the only component that sees both a
# policy halt and a human decision, so it is the only place a confirmation can be
# counted; wiring the recorders here is what makes I1's report observe real
# confirmations rather than only test doubles.
agentos-infer = { workspace = true }
agentos-pager = { path = "../agentos-pager" }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The session tests build a `UserId` directly, the same way the eval rig does.
uuid = { workspace = true }
# The live end-to-end test needs a real model. Gated behind the same `ollama`
# feature as the rest of the repository, so a default build pulls no HTTP client
# and the live tests stay opt-in.
agentos-infer = { workspace = true, features = ["ollama"] }
