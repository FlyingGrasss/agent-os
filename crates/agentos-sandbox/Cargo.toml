[package]
name = "agentos-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentos-types = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

# Landlock LSM confinement. Linux only; the crate compiles elsewhere without it.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
# `unshare(2)` and `mount(2)` for the worker's user and mount namespaces. Linux
# only; the namespace module compiles to a refusal elsewhere.
rustix = { version = "1", features = ["mount", "thread"] }

# The pool's fd passing, its Unix control socket, and both worker images use raw
# syscalls so a test can assert on exactly which syscall was refused. That is
# Unix, not Linux: `agentos-quarantine` needs it on the same basis.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The escape tests make raw syscalls (socket(2), kill(2), prctl(2)) so they can
# assert on exactly which syscall was refused rather than on a std wrapper.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[[bin]]
name = "agentos-worker"
path = "src/bin/agentos-worker.rs"

[[bin]]
name = "agentos-probe-worker"
path = "src/bin/agentos-probe-worker.rs"

# The cgroup/namespace integration tests need a worker image that is not the
# libtest harness: the pool's seccomp profile denies the thread-spawning
# syscalls libtest needs to start. It lives under `tests/` rather than
# `src/bin/` because it exists only for those tests, and is located through
# `CARGO_BIN_EXE_agentos-cgroup-probe` so the tests never guess a target path.
[[bin]]
name = "agentos-cgroup-probe"
path = "tests/probe/agentos-cgroup-probe.rs"