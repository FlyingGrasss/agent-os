[package]
name = "agentos-infer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentos-types = { workspace = true }
agentos-dsl = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Only the tests need deterministic user ids. The crate itself takes them from
# the session.
[dev-dependencies]
uuid = { workspace = true }

[features]
default = []
# The Ollama backend. Off by default so a portable build pulls in neither an HTTP
# stack nor anything else a local-model client might pull in. The client itself is
# hand-rolled over `std::net::TcpStream` for the same reason, so enabling this
# adds no dependencies at all.
ollama = []
