[package]
name = "agentos-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
agentos-dsl = { path = "../crates/agentos-dsl" }
agentos-core = { path = "../crates/agentos-core" }
agentos-types = { path = "../crates/agentos-types" }
serde_json = "1.0"

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_coercion"
path = "fuzz_targets/fuzz_coercion.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_target_1"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false